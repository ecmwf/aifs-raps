# n320 (~31km) configuration. Transformer processor on an o96 hidden grid.

defaults:
  - data: zarr
  - model: transformer
  - graph: encoder_decoder_only
  - training: single
  - base # after the groups above, so base.yaml overrides them
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

system:
  input:
    # Real data. Synthetic datasets support only octahedral (oNNN) grids.
    dataset: ${oc.env:AIFS_DATA_DIR}/aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v8.zarr
    graph: ${oc.env:AIFS_GRAPH_DIR}/n320_encoder_decoder_only_o96.graph

data:
  resolution: n320

graph:
  nodes:
    hidden:
      node_builder:
        grid: o96

model:
  num_channels: 1024

dataloader:
  training:
    datasets:
      data:
        start: 2020-01-01
        end: 2022-12-31
  validation:
    datasets:
      data:
        start: 2023-01-01
        end: 2023-01-31
