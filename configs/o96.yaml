# Small o96 (~1 degree) configuration. Fits on a single GPU and runs in a few
# minutes; use it to check that an environment works before running the larger
# benchmarks.

defaults:
  - data: zarr
  - model: graphtransformer
  - graph: multi_scale
  - training: single
  - base # after the groups above, so base.yaml overrides them
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

system:
  input:
    # Synthetic data. For real data: bin/train --dataset=aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr
    dataset: synthetic:o96
    graph: ${oc.env:AIFS_GRAPH_DIR}/o96_multi_scale_l5.graph

data:
  resolution: o96

graph:
  nodes:
    hidden:
      node_builder:
        resolution: 5

model:
  num_channels: 512

dataloader:
  limit_batches:
    training: 50
    validation: 5
  training:
    datasets:
      data:
        start: 2020-01-01
        end: 2020-12-31
  validation:
    datasets:
      data:
        start: 2021-01-01
        end: 2021-01-31
