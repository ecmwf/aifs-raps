# o1280 (~9km, the resolution of the operational IFS) configuration.
# Graph transformer processor on a refinement-level 6 icosahedral hidden mesh.

defaults:
  - data: zarr_no_insolation
  - model: graphtransformer
  - graph: multi_scale
  - training: single
  - base # after the groups above, so base.yaml overrides them
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

system:
  hardware:
    num_gpus_per_model: 2
  input:
    # Synthetic data. For real data: bin/train --dataset=aifs-od-an-oper-0001-mars-o1280-2016-2023-6h-v1.zarr
    dataset: synthetic:o1280
    graph: ${oc.env:AIFS_GRAPH_DIR}/o1280_multi_scale_l6.graph

data:
  resolution: o1280

graph:
  nodes:
    hidden:
      node_builder:
        resolution: 6

model:
  keep_batch_sharded: True
  num_channels: 1024
  processor:
    num_chunks: 2
  encoders:
    "0":
      mapper:
        shard_strategy: edges
        num_chunks: 4
  decoders:
    "0":
      mapper:
        shard_strategy: edges
        num_chunks: 4

dataloader:
  num_workers:
    training: 6
    validation: 6
  training:
    datasets:
      data:
        start: 2023-01-01
        end: 2023-09-05
  validation:
    datasets:
      data:
        start: 2023-09-06
        end: 2023-09-07
